# ==============================
# RabbitMQ 4 — Cluster de 5 nós
# ==============================
# Todos os nós compartilham o mesmo Erlang Cookie e a mesma
# configuração de peer discovery. A rede bridge interna permite
# que os contêineres se resolvam pelo hostname.
#
# Uso:
#   docker compose -f docker-compose-cluster.yml up -d
#
# Após subir, execute o script de formação do cluster:
#   bash form-cluster.sh

services:

  rabbitmq1:
    image: rabbitmq:4-management
    container_name: rabbitmq1
    restart: unless-stopped
    hostname: rabbitmq1
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: password
      RABBITMQ_NODENAME: rabbit@rabbitmq1
      RABBITMQ_ERLANG_COOKIE: "CLUSTER_SECRET_TOKEN"
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - data1:/var/lib/rabbitmq
    ports:
      - "5672:5672"     # AMQP   — nó 1 (porta principal usada pelo LB)
      - "15672:15672"   # Management — nó 1
      - "4369:4369"     # EPMD
      - "25672:25672"   # Inter-node
    networks:
      - rabbitmq_cluster

  rabbitmq2:
    image: rabbitmq:4-management
    container_name: rabbitmq2
    restart: unless-stopped
    hostname: rabbitmq2
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: password
      RABBITMQ_NODENAME: rabbit@rabbitmq2
      RABBITMQ_ERLANG_COOKIE: "CLUSTER_SECRET_TOKEN"
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - data2:/var/lib/rabbitmq
    ports:
      - "5673:5672"
      - "15673:15672"
    networks:
      - rabbitmq_cluster
    depends_on:
      - rabbitmq1

  rabbitmq3:
    image: rabbitmq:4-management
    container_name: rabbitmq3
    restart: unless-stopped
    hostname: rabbitmq3
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: password
      RABBITMQ_NODENAME: rabbit@rabbitmq3
      RABBITMQ_ERLANG_COOKIE: "CLUSTER_SECRET_TOKEN"
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - data3:/var/lib/rabbitmq
    ports:
      - "5674:5672"
      - "15674:15672"
    networks:
      - rabbitmq_cluster
    depends_on:
      - rabbitmq1

  rabbitmq4:
    image: rabbitmq:4-management
    container_name: rabbitmq4
    restart: unless-stopped
    hostname: rabbitmq4
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: password
      RABBITMQ_NODENAME: rabbit@rabbitmq4
      RABBITMQ_ERLANG_COOKIE: "CLUSTER_SECRET_TOKEN"
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - data4:/var/lib/rabbitmq
    ports:
      - "5675:5672"
      - "15675:15672"
    networks:
      - rabbitmq_cluster
    depends_on:
      - rabbitmq1

  rabbitmq5:
    image: rabbitmq:4-management
    container_name: rabbitmq5
    restart: unless-stopped
    hostname: rabbitmq5
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: password
      RABBITMQ_NODENAME: rabbit@rabbitmq5
      RABBITMQ_ERLANG_COOKIE: "CLUSTER_SECRET_TOKEN"
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - data5:/var/lib/rabbitmq
    ports:
      - "5676:5672"
      - "15676:15672"
    networks:
      - rabbitmq_cluster
    depends_on:
      - rabbitmq1

volumes:
  data1:
  data2:
  data3:
  data4:
  data5:

networks:
  rabbitmq_cluster:
    driver: bridge
