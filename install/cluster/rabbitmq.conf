# ============================================================
# Configuração compartilhada por todos os nós do cluster
# ============================================================

# --- Auto-formação do cluster via Classic Config Peer Discovery ---
cluster_formation.peer_discovery_backend = rabbit_peer_discovery_classic_config

cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq2
cluster_formation.classic_config.nodes.3 = rabbit@rabbitmq3
cluster_formation.classic_config.nodes.4 = rabbit@rabbitmq4
cluster_formation.classic_config.nodes.5 = rabbit@rabbitmq5

# Intervalo de re-tentativa de conexão entre nós na inicialização
cluster_formation.node_cleanup.interval = 30

# Loga um aviso em vez de remover nós inalcançáveis automaticamente
cluster_formation.node_cleanup.only_log_warning = true

# --- Política de recuperação de partições de rede ---
# pause_minority: nós que ficarem em minoria se auto-suspendem
cluster_partition_handling = pause_minority

# --- Porta do painel de gerenciamento ---
management.listener.port = 15672
